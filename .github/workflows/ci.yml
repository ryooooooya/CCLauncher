name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
  webapp-example:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SECURITY_BASE_URL: https://127.0.0.1:3443
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: node scripts/build.mjs
      - name: Install built tarball in an isolated tool project
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/ryooooooya-cclauncher-*.tgz "$RUNNER_TEMP/cclauncher.tgz"
          mkdir "$RUNNER_TEMP/cclauncher-tools"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/cclauncher-tools/package.json", JSON.stringify({name:"harness-tools",private:true}))'
          pnpm --dir "$RUNNER_TEMP/cclauncher-tools" add --offline --save-dev --save-exact --ignore-scripts "$RUNNER_TEMP/cclauncher.tgz"
      - name: Initialize through installed CLI
        run: pnpm --dir "$RUNNER_TEMP/cclauncher-tools" exec cclauncher init --yes --auth supabase --database supabase --example nextjs-supabase --dir "$RUNNER_TEMP/cclauncher-webapp"
      - name: Load installed context for the generated project
        run: pnpm --dir "$RUNNER_TEMP/cclauncher-tools" exec cclauncher context auth --dir "$RUNNER_TEMP/cclauncher-webapp"
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - name: Check skip, todo and empty suites with the pinned runners
        run: node scripts/test-runner-gates.mjs "$RUNNER_TEMP/cclauncher-webapp"
      - name: Create disposable loopback HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/cc-tls.key" -out "$RUNNER_TEMP/cc-tls.crt" -days 1 -subj /CN=127.0.0.1 -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          chmod 600 "$RUNNER_TEMP/cc-tls.key"
          echo "CCLAUNCHER_TLS_KEY=$RUNNER_TEMP/cc-tls.key" >> "$GITHUB_ENV"
          echo "CCLAUNCHER_TLS_CERT=$RUNNER_TEMP/cc-tls.crt" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - run: pnpm exec supabase start
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - run: pnpm fixtures
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - run: pnpm verify
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - run: pnpm audit --audit-level=high
        working-directory: ${{ runner.temp }}/cclauncher-webapp
      - if: always()
        run: pnpm exec supabase stop --no-backup
        working-directory: ${{ runner.temp }}/cclauncher-webapp
