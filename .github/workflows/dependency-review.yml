name: Template dependency review
on:
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - templates/webapp
          - templates/examples/nextjs-supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - name: Report update candidates
        run: node scripts/check-template-dependencies.mjs "$TEMPLATE_DIRECTORY"
        env:
          TEMPLATE_DIRECTORY: ${{ matrix.directory }}
